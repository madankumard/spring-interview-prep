spring:
  application:
    name: shoplite
  config:
    import:
      - optional:file:./secrets/payment.yaml
      - optional:configtree:./secrets/tree/

shoplite:
  tax:
    region: US
  orders:
    max-items-per-order: 20
    free-shipping-threshold: 50.00
    allowed-countries:
      - IN
      - DE
      - US
  features:
    loyalty:
      enabled: false
  store:
    name: ShopLite (application.yaml)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,shopstats
  endpoint:
    health:
      show-details: when-authorized
      roles: ACTUATOR
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ShopLite
    version: 0.0.1